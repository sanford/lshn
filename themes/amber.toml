darker_background = "#0f0f0f"
lighter_background = "#262626"

foreground = "#e2e2dc"
dark_foreground = "#767676"
light_foreground = "#ecece6"
bright_foreground = "#f6f6ef"

red = "#e5534b"
yellow = "#ffe08a"
orange = "#ffc107"
green = "#b38705"
cyan = "#ffd54f"
blue = "#ffc107"
magenta = "#ffc107"
brown = "#8a6d12"

bright_red = "#ff6b61"
bright_yellow = "#ffecb3"
bright_green = "#a0a0a0"
