[package]
name = "lshn"
version = "0.5.0"
edition = "2024"
description = "A terminal Hacker News reader built for speed: stories, articles and comments on one screen"
repository = "https://github.com/sanford/lshn"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["hacker-news", "reader", "terminal", "tui"]
categories = ["command-line-utilities"]
# What building needs, not the README's screenshots or the dev scripts.
exclude = ["docs/", ".github/", ".cargo/", "run.sh", "run.ps1"]

[dependencies]
crossterm = "0.29.0"
clap = { version = "4.6.7", features = ["derive"] }
# --completions and --man.
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
comrak = { version = "0.55.0", default-features = false }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
terminal-colorsaurus = "1.0.3"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
# Pinned: new and single-maintainer, so updates get read before they land.
omarchy-themes = "=0.1.0"
ureq = { version = "3.4.2", features = ["json"] }
dom_smoothie = "0.18.2"
# dom_smoothie's, to even out tables before it reads the page. Keep in step.
dom_query = "0.28.0"
# The system's store for secrets: Keychain, Credential Manager, Secret Service.
keyring = "4.2.0"
# Where there's no keyring: the session, encrypted with a passphrase.
argon2 = "0.6.0"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
getrandom = "0.4.3"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"

[target."cfg(unix)".dependencies]
# Ctrl-Z: stopping lshn the way the shell would.
libc = "0.2.189"

[dev-dependencies]
insta = "1.48.0"
