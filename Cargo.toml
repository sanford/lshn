[package]
name = "lshn"
version = "0.1.0"
edition = "2024"
description = "A terminal Hacker News reader built for speed: stories, articles and comments on one screen"
repository = "https://github.com/sanford/lshn"
license = "GPL-3.0-or-later"
keywords = ["hacker-news", "reader", "terminal", "tui"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.55.0", default-features = false }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
terminal-colorsaurus = "1.0.3"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
# Pinned: new and single-maintainer, so updates get read before they land.
omarchy-themes = "=0.1.0"
ureq = { version = "3.4.2", features = ["json"] }
dom_smoothie = "0.18.2"

[dev-dependencies]
insta = "1.48.0"
